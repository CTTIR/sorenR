<svg width="500" height="580" viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgsor" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"  stop-color="#1a1340"/>
      <stop offset="100%" stop-color="#0c0820"/>
    </linearGradient>
    <!-- soft learning-field glow behind the map -->
    <radialGradient id="fieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#6D5BD0" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#4A3C9E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4A3C9E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="protoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#B9A6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B9A6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#9F8CF5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9F8CF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sproutGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#F0A94A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F0A94A" stop-opacity="0"/>
    </radialGradient>
    <!-- gradient along stable edges for a sense of flow -->
    <linearGradient id="edgeFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#5B3FC4"/>
      <stop offset="100%" stop-color="#9F6BF5"/>
    </linearGradient>
    <clipPath id="hexsor">
      <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"/>
    </clipPath>
  </defs>

  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145" fill="url(#bgsor)"/>

  <g clip-path="url(#hexsor)">

    <!-- faint grid -->
    <line x1="45" y1="190" x2="455" y2="190" stroke="#2a2060" stroke-width="0.4" opacity="0.35"/>
    <line x1="45" y1="250" x2="455" y2="250" stroke="#2a2060" stroke-width="0.4" opacity="0.35"/>
    <line x1="45" y1="310" x2="455" y2="310" stroke="#2a2060" stroke-width="0.4" opacity="0.35"/>
    <line x1="150" y1="145" x2="150" y2="490" stroke="#2a2060" stroke-width="0.4" opacity="0.28"/>
    <line x1="250" y1="145" x2="250" y2="490" stroke="#2a2060" stroke-width="0.4" opacity="0.28"/>
    <line x1="350" y1="145" x2="350" y2="490" stroke="#2a2060" stroke-width="0.4" opacity="0.28"/>

    <!-- learning field: soft radial halo the map organizes within -->
    <ellipse cx="250" cy="262" rx="185" ry="120" fill="url(#fieldGlow)"/>

    <!-- faint concentric "settling" contours around the BMU -->
    <g fill="none" stroke="#6D5BD0" stroke-width="0.8">
      <circle cx="252" cy="224" r="40" opacity="0.14"/>
      <circle cx="252" cy="224" r="68" opacity="0.10"/>
      <circle cx="252" cy="224" r="98" opacity="0.07"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- DATA CLOUD — the input the map self-organizes toward      -->
    <!-- ══════════════════════════════════════════════════════ -->
    <g fill="#6B5AB5">
      <circle cx="140" cy="312" r="2.2" opacity="0.5"/><circle cx="162" cy="286" r="2" opacity="0.45"/><circle cx="178" cy="318" r="1.8" opacity="0.4"/>
      <circle cx="196" cy="250" r="2" opacity="0.5"/><circle cx="214" cy="222" r="2.2" opacity="0.55"/><circle cx="232" cy="248" r="1.8" opacity="0.45"/>
      <circle cx="250" cy="210" r="2" opacity="0.5"/><circle cx="246" cy="246" r="1.8" opacity="0.45"/><circle cx="272" cy="226" r="2" opacity="0.5"/>
      <circle cx="292" cy="216" r="2.2" opacity="0.55"/><circle cx="308" cy="244" r="1.8" opacity="0.45"/><circle cx="330" cy="240" r="2" opacity="0.5"/>
      <circle cx="344" cy="272" r="2.2" opacity="0.5"/><circle cx="360" cy="298" r="2" opacity="0.45"/><circle cx="332" cy="312" r="1.8" opacity="0.4"/>
      <circle cx="224" cy="300" r="2" opacity="0.45"/><circle cx="258" cy="298" r="1.8" opacity="0.45"/><circle cx="290" cy="306" r="2" opacity="0.45"/>
      <circle cx="200" cy="318" r="1.6" opacity="0.38"/><circle cx="318" cy="318" r="1.6" opacity="0.38"/>
      <circle cx="262" cy="196" r="1.8" opacity="0.42"/><circle cx="286" cy="192" r="1.6" opacity="0.4"/>
      <circle cx="176" cy="268" r="1.5" opacity="0.35"/><circle cx="210" cy="278" r="1.5" opacity="0.35"/>
      <circle cx="300" cy="280" r="1.5" opacity="0.35"/><circle cx="336" cy="290" r="1.5" opacity="0.35"/>
      <circle cx="238" cy="268" r="1.4" opacity="0.32"/><circle cx="268" cy="262" r="1.4" opacity="0.32"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- NEIGHBORHOOD EDGES — the self-organizing topology         -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- stable chain (gradient flow, weighted) -->
    <g stroke="url(#edgeFlow)" stroke-linecap="round" fill="none" opacity="0.85">
      <line x1="150" y1="300" x2="185" y2="262" stroke-width="2.6"/>
      <line x1="185" y1="262" x2="218" y2="236" stroke-width="3"/>
      <line x1="218" y1="236" x2="252" y2="224" stroke-width="3.4"/>
      <line x1="252" y1="224" x2="288" y2="232" stroke-width="3.4"/>
      <line x1="288" y1="232" x2="322" y2="254" stroke-width="3"/>
      <line x1="322" y1="254" x2="350" y2="286" stroke-width="2.6"/>
    </g>
    <!-- branch neighborhoods (thinner, flat purple) -->
    <g stroke="#7C3AED" stroke-width="1.9" opacity="0.6" stroke-linecap="round" fill="none">
      <line x1="185" y1="262" x2="206" y2="300"/>
      <line x1="218" y1="236" x2="238" y2="290"/>
      <line x1="252" y1="224" x2="276" y2="284"/>
      <line x1="322" y1="254" x2="312" y2="300"/>
      <line x1="238" y1="290" x2="276" y2="284"/>
    </g>
    <!-- evolving (new) neighborhood edges — dashed amber, growing -->
    <g stroke="#E0913A" stroke-width="1.9" opacity="0.78" stroke-linecap="round" fill="none" stroke-dasharray="4 4">
      <line x1="252" y1="224" x2="268" y2="210"/>
      <line x1="288" y1="232" x2="300" y2="206"/>
      <line x1="206" y1="300" x2="238" y2="290"/>
      <line x1="312" y1="300" x2="276" y2="284"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- PROTOTYPE NODES — the evolving representations             -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- subtle glow halo under each stable node -->
    <g>
      <circle cx="150" cy="300" r="13" fill="url(#nodeGlow)"/>
      <circle cx="185" cy="262" r="13" fill="url(#nodeGlow)"/>
      <circle cx="218" cy="236" r="13" fill="url(#nodeGlow)"/>
      <circle cx="288" cy="232" r="13" fill="url(#nodeGlow)"/>
      <circle cx="322" cy="254" r="13" fill="url(#nodeGlow)"/>
      <circle cx="350" cy="286" r="13" fill="url(#nodeGlow)"/>
    </g>
    <g>
      <!-- stable prototypes (purple, double-ring) -->
      <g fill="#2a1f55" stroke="#9F8CF5" stroke-width="2">
        <circle cx="150" cy="300" r="7"/>
        <circle cx="185" cy="262" r="7"/>
        <circle cx="218" cy="236" r="7"/>
        <circle cx="288" cy="232" r="7"/>
        <circle cx="322" cy="254" r="7"/>
        <circle cx="350" cy="286" r="7"/>
        <circle cx="238" cy="290" r="6"/>
        <circle cx="276" cy="284" r="6"/>
        <circle cx="206" cy="300" r="6"/>
        <circle cx="312" cy="300" r="6"/>
      </g>
      <!-- inner dots -->
      <g fill="#C4B5F7" opacity="0.85">
        <circle cx="150" cy="300" r="2"/>
        <circle cx="185" cy="262" r="2"/>
        <circle cx="218" cy="236" r="2"/>
        <circle cx="288" cy="232" r="2"/>
        <circle cx="322" cy="254" r="2"/>
        <circle cx="350" cy="286" r="2"/>
      </g>
      <!-- central / winning prototype (bright, glowing BMU) -->
      <circle cx="252" cy="224" r="22" fill="url(#protoGlow)"/>
      <circle cx="252" cy="224" r="12" fill="none" stroke="#E9E2FF" stroke-width="1" opacity="0.35"/>
      <circle cx="252" cy="224" r="8.5" fill="#1a1340" stroke="#E9E2FF" stroke-width="2.8"/>
      <circle cx="252" cy="224" r="3.2" fill="#E9E2FF"/>
      <!-- newly-sprouted prototypes (amber rim, evolving) with glow -->
      <circle cx="268" cy="210" r="11" fill="url(#sproutGlow)"/>
      <circle cx="300" cy="206" r="11" fill="url(#sproutGlow)"/>
      <g fill="#2a1f55" stroke="#E0913A" stroke-width="2">
        <circle cx="268" cy="210" r="5"/>
        <circle cx="300" cy="206" r="5"/>
      </g>
      <g fill="#F0A94A">
        <circle cx="268" cy="210" r="1.6"/>
        <circle cx="300" cy="206" r="1.6"/>
      </g>
    </g>

    <!-- annotation -->
    <text font-family="monospace" font-size="8" fill="#9F8CF5" opacity="0.6"
      text-anchor="middle" x="250" y="366">self-organizing · evolving neighborhoods</text>
    <text font-family="monospace" font-size="8.5" font-weight="700" fill="#C4B5F7" opacity="0.82"
      text-anchor="middle" x="250" y="402" letter-spacing="3">SOREN</text>

  </g>

  <!-- Hex border — statistics group purple -->
  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"
    fill="none" stroke="#534AB7" stroke-width="11" stroke-linejoin="round"/>
  <polygon points="250,44 441,153 441,367 250,476 59,367 59,153"
    fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>
</svg>
